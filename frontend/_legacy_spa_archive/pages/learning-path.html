<div class="page-content animate-in" style="max-width:1080px;margin:0 auto;">
  
  <!-- Journey Track Header -->
  <div class="card" style="padding:26px 30px;margin-bottom:28px;background:linear-gradient(135deg,rgba(99,102,241,0.14) 0%,rgba(139,92,246,0.16) 100%);border:1px solid rgba(124,58,237,0.3);position:relative;overflow:hidden;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:18px;">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <span class="badge badge-purple" style="font-size:12px;font-weight:700;">7-Module Core Curriculum</span>
          <span class="badge badge-green" id="lp-skill-badge">Beginner Track</span>
        </div>
        <h1 class="page-title" style="font-size:24px;margin-bottom:6px;">Structured Python Learning Road</h1>
        <p class="page-sub" style="margin:0;">Step-by-step interactive lessons, code demonstrations, and progression milestones.</p>
      </div>

      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-secondary btn-sm" onclick="window.location.hash='#playground'">
          <span>🌐 Playground</span>
        </button>
        <button class="btn btn-primary btn-sm" onclick="window.location.hash='#practice'">
          <span>💻 Practice Lab</span>
        </button>
      </div>
    </div>

    <!-- Overall Track Progress Bar -->
    <div style="margin-top:22px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px;">
        <span id="lp-progress-label">Track Progress: 0 of 14 Topics Mastered</span>
        <span style="color:var(--text-accent);" id="lp-progress-pct">0%</span>
      </div>
      <div class="progress-bar-wrap" style="height:10px;">
        <div class="progress-bar-fill" id="lp-progress-fill" style="width:0%;"></div>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div style="display:flex;gap:20px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;">
    <span style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;">
      <span style="width:10px;height:10px;border-radius:50%;background:var(--green);"></span> Completed / Mastered
    </span>
    <span style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;">
      <span style="width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 8px var(--purple);"></span> Current Objective
    </span>
    <span style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;">
      <span style="width:10px;height:10px;border-radius:50%;background:var(--text-muted);"></span> Locked (Prerequisite Required)
    </span>
  </div>

  <!-- Modules List Container -->
  <div id="lp-modules-container" style="display:flex;flex-direction:column;gap:20px;">
    <!-- Rendered dynamically -->
  </div>

</div>
