<div class="page-content animate-in">
  
  <div class="admin-header">
    <div>
      <h1 class="page-title" style="font-size:24px;margin-bottom:4px;">Student Management & Progress Inspection</h1>
      <p class="page-sub" style="margin:0;">Inspect individual student progress, submissions, and assessments directly from the admin interface.</p>
    </div>
    <button class="btn btn-primary btn-sm" id="btn-refresh-students">
      <span>↺ Refresh List</span>
    </button>
  </div>

  <!-- Admin Sub-Navigation Pills -->
  <div class="admin-tab-nav">
    <button class="admin-tab-pill" onclick="window.location.hash='#admin-dashboard'">Overview</button>
    <button class="admin-tab-pill active" onclick="window.location.hash='#admin-students'">Student Management</button>
    <button class="admin-tab-pill" onclick="window.location.hash='#admin-topics'">Curriculum & Creator</button>
    <button class="admin-tab-pill" onclick="window.location.hash='#admin-analytics'">Platform Analytics</button>
  </div>

  <!-- Student Table Surface -->
  <div class="admin-table-wrap">
    
    <!-- Filter bar -->
    <div class="admin-filters-bar">
      <input type="text" id="adm-student-search" class="input-field" placeholder="🔍 Search by username or email..." style="max-width:280px;padding:7px 12px;font-size:12.5px;">
      
      <select id="adm-student-level-filter" class="input-field" style="max-width:180px;padding:7px 12px;font-size:12.5px;">
        <option value="">All Skill Levels</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>

      <select id="adm-student-status-filter" class="input-field" style="max-width:150px;padding:7px 12px;font-size:12.5px;">
        <option value="">All Statuses</option>
        <option value="true">Active Only</option>
        <option value="false">Disabled Only</option>
      </select>
    </div>

    <!-- Table -->
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Student</th>
            <th>Email</th>
            <th>Skill Tier</th>
            <th>Quiz Score</th>
            <th>Submissions</th>
            <th>Avg Score</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adm-students-tbody">
          <tr>
            <td colspan="8" style="text-align:center;padding:32px;color:var(--text-muted);">Loading registered students...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Dedicated Student Dossier Inspector Modal -->
  <div id="adm-dossier-modal" class="modal-overlay hidden">
    <div class="modal-card" style="max-width:860px;max-height:88vh;display:flex;flex-direction:column;">
      <div style="padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h3 style="font-size:16px;margin:0;color:#fff;" id="dossier-student-title">Student Progress Dossier</h3>
          <span style="font-size:12px;color:var(--text-muted);" id="dossier-student-email">email@example.com</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-close-dossier" style="font-size:16px;padding:4px 8px;">✕</button>
      </div>

      <!-- Dossier Tabs -->
      <div style="display:flex;gap:4px;padding:10px 24px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);">
        <button class="admin-tab-pill active" id="dossier-tab-mastery">Topic Mastery</button>
        <button class="admin-tab-pill" id="dossier-tab-subs">Code Submissions</button>
        <button class="admin-tab-pill" id="dossier-tab-assess">Assessments</button>
      </div>

      <!-- Dossier Dynamic Content -->
      <div style="flex:1;overflow-y:auto;padding:24px;" class="custom-scroll" id="dossier-content-body">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

</div>
